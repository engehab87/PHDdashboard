  <style>
    /* Design base layer (executive vehicle access console) */
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
      ::-webkit-scrollbar { display: none; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 20; }
    }
  </style>
  
  <style>
    /* Critical Shell Structure */
    #root {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background-color: var(--background);
    }
    
    /* Left Sidebar (256px Fixed) */
    #app-sidebar {
      width: 256px;
      min-width: 256px;
      background-color: var(--surface-container-lowest);
      border-right: 1px solid var(--hairline-divider);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      overflow-y: auto;
    }
    
    /* Topbar (66px Sticky) */
    #app-topbar {
      height: 66px;
      background-color: var(--surface-container-lowest);
      border-bottom: 1px solid var(--hairline-divider);
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    
    #app-main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--background);
    }
    
    #content-container {
      max-width: 1520px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    /* Nav Item States */
    .nav-item-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 16px;
      margin: 2px 10px;
      border-radius: var(--radius-default);
      color: var(--secondary);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 120ms ease;
    }
    .nav-item-link:hover {
      background-color: var(--surface-subtle);
      color: var(--primary-container);
    }
    .nav-item-link.active {
      background-color: #ffdad6;
      color: var(--primary-container);
      font-weight: 600;
    }
    [data-theme="dark"] .nav-item-link.active {
      background-color: rgba(196, 22, 28, 0.2);
      color: #ffb4ab;
    }
    
    .nav-group-header {
      font-family: var(--font-display);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8c8885;
      padding: 16px 20px 6px;
    }
  </style>

  <!-- Master Application Mount Root -->

  </div>

  <!-- Global Slide-Out Detail Drawer Scrim & Panel -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <div id="drawer-panel" class="drawer-panel">
    <div id="drawer-content" style="height:100%; display:flex; flex-direction:column;"></div>
  </div>

  <!-- Global Notification Shelf -->
