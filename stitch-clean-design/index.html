<!-- ==========================================================================
     Palm Hills Executive Real Estate Intelligence — HTML Bootstrap
     File: index.html
     ========================================================================== -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Hills Executive Real Estate Intelligence</title>
  
  <!-- Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* Critical Shell Structure */
    #root {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background-color: var(--background);
    }
    
    /* Left Sidebar (256px Fixed) */
    #app-sidebar {
      width: 256px;
      min-width: 256px;
      background-color: var(--surface-container-lowest);
      border-right: 1px solid var(--hairline-divider);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      overflow-y: auto;
    }
    
    /* Topbar (66px Sticky) */
    #app-topbar {
      height: 66px;
      background-color: var(--surface-container-lowest);
      border-bottom: 1px solid var(--hairline-divider);
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    
    #app-main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--background);
    }
    
    #content-container {
      max-width: 1520px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    /* Nav Item States */
    .nav-item-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 16px;
      margin: 2px 10px;
      border-radius: var(--radius-default);
      color: var(--secondary);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: all 120ms ease;
    }
    .nav-item-link:hover {
      background-color: var(--surface-subtle);
      color: var(--primary-container);
    }
    .nav-item-link.active {
      background-color: #ffdad6;
      color: var(--primary-container);
      font-weight: 600;
    }
    [data-theme="dark"] .nav-item-link.active {
      background-color: rgba(196, 22, 28, 0.2);
      color: #ffb4ab;
    }
    
    .nav-group-header {
      font-family: var(--font-display);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8c8885;
      padding: 16px 20px 6px;
    }
  </style>
</head>
<body>
  <!-- Master Application Mount Root -->
  <div id="root">
    <!-- Populated dynamically by app.js (renders either Login Screen or Dashboard Shell) -->
  </div>

  <!-- Global Slide-Out Detail Drawer Scrim & Panel -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <div id="drawer-panel" class="drawer-panel">
    <div id="drawer-content" style="height:100%; display:flex; flex-direction:column;"></div>
  </div>

  <!-- Global Notification Shelf -->
  <div id="toast-shelf"></div>

  <!-- Core Logic & Pages -->
  <script src="app-pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
